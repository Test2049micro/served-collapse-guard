[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "served-collapse-guard"
version = "0.1.0"
description = "Audit which model an OpenAI-compatible gateway actually served you"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["llm-gateway", "openai-compatible", "model-routing", "audit", "multi-agent-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
served-collapse-guard = "served_collapse_guard.cli:main"

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
