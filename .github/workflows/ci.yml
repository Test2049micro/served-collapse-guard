name: ci

on:
  push:
    branches: [main]
  pull_request:

# Grant write permissions only to jobs that publish artifacts.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # the suite runs against the source tree with no install, so PYTHONPATH is
      # required: a bare `unittest discover` fails to import the package and the
      # root conftest.py only helps pytest
      - name: stdlib-only suite
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      # a real sdist+wheel build, not just an editable install: this is what the
      # release job uploads, and twine check is what PyPI's own form validator runs
      - name: build and check distribution metadata
        if: matrix.python-version == '3.12'
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: install and smoke
        if: matrix.python-version == '3.12'
        run: |
          pip install -e .
          served-collapse-guard --version
          served-collapse-guard vendors claude-3-7 gpt-5 auto-router/x unheard-of-9
          # a dead endpoint must report insufficient evidence (exit 2), never a pass.
          # These commands exit non-zero *by contract*, so capture the status instead
          # of letting `bash -e` treat a correct answer as a failed step.
          set +e
          served-collapse-guard probe --endpoint 127.0.0.1:1 --timeout 1 gpt-4o --json > probe.json
          rc=$?
          set -e
          test "$rc" -eq 2
          python -c "import json; r=json.load(open('probe.json'))[0]; assert r['ok'] is False and r['error'], r"
