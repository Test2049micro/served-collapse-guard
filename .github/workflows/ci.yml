name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: stdlib-only suite
        run: python -m unittest discover -s tests -v
      - name: install and pytest
        if: matrix.python-version == '3.11'
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: offline vendor classification smoke
        if: matrix.python-version == '3.11'
        run: |
          served-collapse-guard vendors claude-3-7 gpt-5 auto-router/x unknown-model-9
          served-collapse-guard probe --endpoint 127.0.0.1:1 gpt-4o --json || [ $? -eq 2 ]
